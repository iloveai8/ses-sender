# 对拍语料（P4 account 域起步；随域推进扩充）
# 用法见 tools/harness/main.go：record 录 Python 金标准 → diff 打 Go 对比
# auth: 空=匿名 | admin/user=自动登录取 token（种子账号见 defaults）
# skip: diff 时跳过（录制后不可重复执行的写操作）

defaults:
  admin_user: admin
  admin_pass: admin123
  user_name: user1
  user_pass: user112345

cases:
  # ── 健康与基础 ──
  - name: health
    method: GET
    path: /

  # ── 登录（A1/A2）──
  - name: login-missing-password
    method: POST
    path: /auth/login
    body: { username: admin }
  - name: login-wrong-password
    method: POST
    path: /auth/login
    body: { username: admin, password: wrong-pass }
  - name: login-disabled-unknown-user
    method: POST
    path: /auth/login
    body: { username: nosuchuser, password: whatever123 }
  - name: login-ok-admin
    method: POST
    path: /auth/login
    body: { username: admin, password: admin123 }

  # ── 鉴权中间件矩阵 ──
  - name: me-no-token
    method: GET
    path: /auth/me
  - name: me-bad-token
    method: GET
    path: /auth/me
    headers: { Authorization: "Bearer bad.token.here" }
  - name: me-ok-admin
    method: GET
    path: /auth/me
    auth: admin

  # ── 用户管理（A3：admin 专属 + 403/400/404 分支）──
  - name: admin-users-list
    method: GET
    path: /admin/users
    auth: admin
  - name: admin-users-create-ok
    method: POST
    path: /admin/users
    auth: admin
    body: { username: corpususer1, display_name: 语料用户, password: pass123456, email: corpus1@harness.local }
    skip: true   # 写操作：录一次即锁定，diff 跳过（幂等性由集成测试覆盖）
  - name: admin-users-create-noauth
    method: POST
    path: /admin/users
    body: { username: x1, display_name: x, password: x123456, email: x@x.com }
  - name: admin-users-create-forbidden
    method: POST
    path: /admin/users
    auth: admin   # user 角色未播种前先以 admin 验证 422 负例；P4 扩 user 角色后改 auth: user
    body: {}      # 空体 → 422 pydantic 形状锚定
  - name: admin-users-update-notfound
    method: PUT
    path: /admin/users/999999
    auth: admin
    body: { display_name: 不存在的用户 }

  # ── 个人设置（A4）──
  - name: unsub-defaults
    method: GET
    path: /user/unsub-defaults
    auth: admin
  - name: unsub-config-empty
    method: GET
    path: /user/unsub-config
    auth: admin
  - name: contact-email-empty-reject
    method: PUT
    path: /user/contact-email
    auth: admin
    body: { contact_email: "" }

  # ── P5 contact：客群 ──
  - name: groups-list-seeded
    method: GET
    path: /groups
    auth: admin
  - name: groups-list-search-miss
    method: GET
    path: /groups?search=nosuchgroup
    auth: admin
  - name: groups-create-noauth
    method: POST
    path: /groups
    body: { name: x }
  - name: groups-create-ok
    method: POST
    path: /groups
    auth: admin
    body: { name: corpus-group, description: 语料临时客群 }
    skip: true
  - name: groups-put-notfound
    method: PUT
    path: /groups/99999
    auth: admin
    body: { name: 不存在的客群 }
  - name: groups-delete-notfound
    method: DELETE
    path: /groups/99999
    auth: admin
  # ── P5 contact：联系人 ──
  - name: contacts-list-seeded
    method: GET
    path: /groups/1/contacts
    auth: admin
  - name: contacts-list-search
    method: GET
    path: /groups/1/contacts?search=seed1
    auth: admin
  - name: contacts-list-group-notfound
    method: GET
    path: /groups/99999/contacts
    auth: admin
  - name: contacts-create-group-notfound
    method: POST
    path: /contacts
    auth: admin
    body: { email: x@x.com, name: x, group_id: 99999 }
  - name: contacts-create-422-missing
    method: POST
    path: /contacts
    auth: admin
    body: { name: 只有名字 }
  - name: contacts-create-ok
    method: POST
    path: /contacts
    auth: admin
    body: { email: corpus-c1@harness.local, name: 语料联系人, group_id: 1, attributes: '{"k":"v"}' }
    skip: true
  - name: contacts-delete-notfound
    method: DELETE
    path: /contacts/99999
    auth: admin

  # ── P6a template ──
  - name: templates-list-seeded
    method: GET
    path: /user/templates
    auth: admin
  - name: templates-create-noauth
    method: POST
    path: /user/templates
    body: { name: x, subject: y }
  - name: templates-create-422-missing
    method: POST
    path: /user/templates
    auth: admin
    body: {}
  - name: admin-templates-list
    method: GET
    path: /admin/templates
    auth: admin
  - name: templates-create-ok
    method: POST
    path: /user/templates
    auth: admin
    body: { name: corpus-tpl, subject: 语料模板, html_body: "<p>hi</p>" }
    skip: true   # 真实 SES 双写（录制一次锁定响应形状）
  - name: templates-put-notfound
    method: PUT
    path: /user/templates/99999
    auth: admin
    body: { subject: 新主题 }
  - name: templates-delete-notfound
    method: DELETE
    path: /user/templates/99999
    auth: admin
  - name: attachments-list-seeded
    method: GET
    path: /user/templates/1/attachments
    auth: admin
  - name: attachments-list-notfound
    method: GET
    path: /user/templates/99999/attachments
    auth: admin
  - name: attachments-delete-notfound
    method: DELETE
    path: /user/templates/1/attachments/999
    auth: admin

  # ── P6b system：settings ──
  - name: settings-get-defaults
    method: GET
    path: /admin/settings
    auth: admin
  - name: settings-put-noauth
    method: PUT
    path: /admin/settings
    body: { unsub_page_title: x }
  - name: settings-put-ok
    method: PUT
    path: /admin/settings
    auth: admin
    body: { unsub_page_title: 语料标题 }
    skip: true
  # ── P6b system：ai-models ──
  - name: ai-models-get-empty
    method: GET
    path: /admin/ai-models
    auth: admin
  - name: ai-models-available-empty
    method: GET
    path: /ai-models/available
    auth: admin
  - name: ai-models-put-ok
    method: PUT
    path: /admin/ai-models
    auth: admin
    body: { models: [] }
    skip: true
  # ── P6b system：blacklist ──
  - name: blacklist-list-empty
    method: GET
    path: /admin/blacklist
    auth: admin
  - name: blacklist-count
    method: GET
    path: /admin/blacklist/count
    auth: admin
  - name: blacklist-add-noauth
    method: POST
    path: /admin/blacklist
    body: { email: x@x.com }
  - name: blacklist-add-ok
    method: POST
    path: /admin/blacklist
    auth: admin
    body: { email: corpus-bl@harness.local, reason: corpus }
    skip: true
  - name: blacklist-add-dup
    method: POST
    path: /admin/blacklist
    auth: admin
    body: { email: corpus-bl@harness.local }
    skip: true   # 依赖 add-ok 已执行（record 顺序保证）
  - name: blacklist-delete-notfound
    method: DELETE
    path: /admin/blacklist/99999
    auth: admin
  - name: blacklist-batch-delete-empty
    method: POST
    path: /admin/blacklist/batch-delete
    auth: admin
    body: { ids: [] }

  # ── P7 campaign 读侧 ──
  - name: dashboard-seeded
    method: GET
    path: /user/dashboard
    auth: admin
  - name: daily-quota
    method: GET
    path: /user/daily-quota
    auth: admin
  - name: sending-jobs-list
    method: GET
    path: /sending-jobs
    auth: admin
  - name: batch-metrics
    method: GET
    path: /sending-jobs/batch-seed000001/metrics
    auth: admin
  - name: batch-metrics-notfound
    method: GET
    path: /sending-jobs/batch-nope000009/metrics
    auth: admin
  - name: batch-details
    method: GET
    path: /sending-jobs/batch-seed000001/details
    auth: admin
  - name: batch-progress
    method: GET
    path: /sending-jobs/batch-seed000001/progress
    auth: admin
  - name: email-details-filter-failed
    method: GET
    path: /email-details?send_status=Failed
    auth: admin
  - name: admin-users-quotas
    method: GET
    path: /admin/users/quotas
    auth: admin
  - name: admin-sending-stats
    method: GET
    path: /admin/sending-stats
    auth: admin
  - name: admin-sending-jobs
    method: GET
    path: /admin/sending-jobs
    auth: admin
  - name: scheduled-jobs-list
    method: GET
    path: /scheduled-jobs
    auth: admin
  - name: scheduled-create-tpl-notfound
    method: POST
    path: /scheduled-jobs
    auth: admin
    body: { template_id: 99999, group_id: 1, schedule_type: daily, scheduled_time: "2027-01-01T09:00:00" }
  - name: scheduled-create-badtime
    method: POST
    path: /scheduled-jobs
    auth: admin
    body: { template_id: 1, group_id: 1, schedule_type: daily, scheduled_time: "not-a-time" }
  - name: scheduled-delete-notfound
    method: DELETE
    path: /scheduled-jobs/99999
    auth: admin
  - name: unsub-list-seeded
    method: GET
    path: /unsubscribe-list
    auth: admin
  - name: unsub-restore-ok
    method: DELETE
    path: /unsubscribe-list/1
    auth: admin
    skip: true
  - name: unsub-batch-delete-empty
    method: POST
    path: /unsubscribe-list/batch-delete
    auth: admin
    body: { ids: [] }
